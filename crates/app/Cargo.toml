[package]
name = "lithe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lithe"
path = "src/main.rs"

[dependencies]
lithe-core.workspace = true
lithe-gpu.workspace = true
lithe-syntax.workspace = true
lithe-search.workspace = true
lithe-lsp.workspace = true
lithe-vcs.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
pulldown-cmark.workspace = true
image.workspace = true
resvg.workspace = true
tiny-skia.workspace = true
winit.workspace = true
arboard.workspace = true
muda.workspace = true
rfd.workspace = true
nucleo.workspace = true
ignore.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true

# Gives lithe.exe its icon and its version information, the way the
# Info.plist does for the Mac bundle. Windows only, and build-time only.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true
